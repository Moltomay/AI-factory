# Local hooks — install once per clone: `pre-commit install`
# Human-owned: agents must not edit or weaken this file (see AGENTS.md §2).

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: no-commit-to-branch
        args: [--branch, main, --branch, master]
      - id: detect-private-key
      - id: check-added-large-files
        args: [--maxkb=1000] # blocks accidental data/model files
      - id: check-merge-conflict
