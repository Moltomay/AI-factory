name: CI

# Reusable baseline CI — copy to .github/workflows/ci.yml in every repo.
# Gates: secrets scan, lint (ruff + import-linter), unit tests, dependency audit.
# Human-owned: agents must not edit this file without approval (see AGENTS.md §2).

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  # For a src/ layout, set PYTHONPATH to src so import-linter finds the package.
  PYTHONPATH: "."

jobs:
  secrets-scan:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans the full history

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install lint tools
        run: pip install ruff==0.16.9 import-linter==2.15

      - name: Ruff — static checks
        run: ruff check . --output-format=github

      - name: Ruff — formatting (check only, no changes applied)
        run: ruff format --check --diff .

      - name: Import-linter — architecture contracts
        run: lint-imports

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install pytest==9.1.1

      - name: Run unit tests
        run: pytest tests/unit -v

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Run pip-audit
        run: |
          pip install pip-audit==2.10.1
          pip-audit

# TODO (future hardening, not required yet):
#   - SonarQube/SonarCloud quality job on push to main.
#   - Mutation testing (mutmut) + pytest --cov with a minimum threshold.
#   - Split tests/unit vs tests/integration into separate jobs once integration
#     tests need external services / credentials via GitHub Secrets.
